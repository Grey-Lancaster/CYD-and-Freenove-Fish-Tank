; Feenove-Aquarium: animated fish tank for the Freenove FNK0104S
; (ESP32-S3 N16R8, 4.0" ST7796 480x320, FT6336U touch).
; Display/board settings are carried over from the Feenove-104S project.
[platformio]
boards_dir = boards
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.embed_files =
    src/bubbles.raw
    src/feed.raw
lib_extra_dirs = lib_freenove
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
